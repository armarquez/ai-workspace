# Repo-scoped toolchain. Bootstrap only needs `mise` + `direnv` + `op` (1Password
# CLI) installed on the host; `mise install` handles everything else.
#
# When a version needs bumping, look up the current stable release (mise
# registry / GitHub releases) — do not guess from memory.

[tools]
just     = "1.58.0"     # https://github.com/casey/just/releases
uv       = "0.12.5"     # https://github.com/astral-sh/uv/releases
node     = "22"         # https://nodejs.org/en/about/previous-releases — npx-based MCP servers
python   = "3.13"       # for basic-memory and sync-mcp.py
claude   = "2.1.233"    # https://github.com/anthropics/claude-code/releases
agy      = "1.1.13"     # https://github.com/google-antigravity/antigravity-cli/releases
opencode = "1.18.18"    # https://github.com/anomalyco/opencode/releases
codex    = "0.149.1"    # https://github.com/openai/codex/releases — tags are prefixed `rust-`
ollama   = "0.32.14"    # https://github.com/ollama/ollama/releases — see ollama/README.md if install fails
prek     = "0.4.13"     # https://github.com/j178/prek/releases — pre-commit hook runner
gitleaks = "8.30.1"     # https://github.com/gitleaks/gitleaks/releases — also used standalone via `gitleaks detect`
"github:armarquez/claude-squad" = "1.0.21" # our fork (adds Forgejo/tea CLI support) of https://github.com/smtg-ai/claude-squad — parallel agent sessions, see squad/
tmux     = "3.7c"       # https://github.com/tmux/tmux-builds/releases — required by claude-squad
gh       = "2.100.0"    # https://cli.github.com — required by claude-squad for GitHub-hosted repos; Forgejo-hosted repos use `tea` instead (not mise-managed, see infra's justfile)

"pipx:basic-memory" = "0.22.1"  # https://pypi.org/project/basic-memory/

[env]
OLLAMA_API_BASE = "http://127.0.0.1:11434"
# Claude Code self-updates the installed binary; without this the version
# pin above only fixes the *initial* install.
DISABLE_AUTOUPDATER = "1"
