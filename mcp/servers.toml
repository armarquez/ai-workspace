# Canonical MCP server definitions. scripts/sync-mcp.py renders this into
# each CLI's native config format (see README for the per-CLI path/schema
# table) — this file is the only place a server gets added or removed.
#
# Fields:
#   type    = "stdio" (default) | "http"
#   command + args (+ env)  -- for stdio; env values may use ${VAR}, which
#                              sync-mcp.py leaves literal so the target CLI
#                              expands it at its own runtime.
#   url + headers            -- for http
#   startup_timeout_sec      -- Codex-only (its MCP client's handshake deadline,
#                                default 10s upstream); every other renderer here
#                                ignores this field.
#
# basic-memory has no env var for its project path — it resolves projects by
# name via its own project registry (`basic-memory project add ...`, run by
# `just doctor`), not from this file. See scripts/doctor.sh.

[basic-memory]
type = "stdio"
command = "uvx"
# Pinned — an unpinned `uvx basic-memory` resolves to whatever's latest at launch
# time, independent of mise.toml's pin. Divergence between the two breaks
# ~/.basic-memory/memory.db's Alembic migrations: whichever version touches the
# shared db last migrates it forward, and an older CLI can't open a db stamped
# by a newer one. Keep this version in sync with mise.toml's pipx:basic-memory pin.
args = ["basic-memory@0.23.2", "mcp"]
description = "Shared markdown memory across all providers"
# A cold first start (fresh worktree, first-ever invocation) runs basic-memory's
# SQLite migrations + semantic-embedding init in the same process that's also
# answering Codex's MCP handshake — under WSL2 that can occasionally exceed
# Codex's 10s default, surfacing as "connection closed: initialize response".
# 30s gives a cold start real headroom; a warm start still finishes in well
# under a second either way.
startup_timeout_sec = 30
