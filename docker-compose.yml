services:
  mcp-memory-gateway:
    image: supercorp/supergateway:latest
    container_name: mcp-memory-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MEMORY_FILE_PATH=/data/memory.jsonl
    volumes:
      - ./data:/data
    command:
      - --port
      - "8000"
      - --stdio
      - "npx -y @modelcontextprotocol/server-memory"
      - --baseUrl
      - "http://localhost:8000"
      - --ssePath
      - "/sse"
      - --messagePath
      - "/message"